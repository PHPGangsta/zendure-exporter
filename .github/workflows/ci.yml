name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25", "1.26"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: go mod download
        run: go mod download
      - name: build
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            VERSION="dev"
          fi
          go build -v -ldflags="-X main.version=${VERSION}" ./...
      - name: test
        run: go test -v -race -count=1 ./...
      - name: validate example config
        run: go run ./cmd/zendure-exporter -check-config -config config.example.yml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # Must satisfy go.mod's `go 1.25` floor: setup-go pins
          # GOTOOLCHAIN=local, so an older Go here can't auto-upgrade and
          # golangci-lint fails to load packages.
          go-version: "1.25"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          # .golangci.yml uses the v2 config schema, so we need
          # golangci-lint v2.x. Action pinned to v9 (Node 24 runtime);
          # the linter version is pinned for reproducible CI.
          version: v2.12.2

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      # govulncheck reports only vulnerabilities the code actually reaches
      # (call-graph analysis). Pinned for reproducible CI — bump
      # deliberately; the vulnerability DB is fetched fresh at run time.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build multi-arch image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: zendure-exporter:ci
